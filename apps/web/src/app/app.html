<div class="app-shell">
  <a class="skip-link" href="#main-content">{{ 'shell.skipToContent' | transloco }}</a>
  <input #fileInput id="score-file" class="visually-hidden" type="file" accept=".gp3,.gp4,.gp5,.gpx,.gp"
    [attr.aria-label]="'file.choose' | transloco" [title]="'file.choose' | transloco" [disabled]="!session.available() || session.state().status === 'loading' || session.viewBusy()" (change)="openFile($event)">
  <gp-app-header [active]="section()" (navigate)="section.set($event)" />
  <div class="workspace" [class.sidebar-collapsed]="sidebarCollapsed()" [class.tracks-collapsed]="tracksCollapsed()">
    <gp-library-panel [collapsed]="sidebarCollapsed()" [busy]="!session.available() || session.state().status === 'loading' || session.viewBusy()"
      (toggle)="sidebarCollapsed.set(!sidebarCollapsed())" (openTab)="chooseFile()" />
    <main id="main-content" class="main-content" tabindex="-1">
      <gp-score-viewer [class.inactive]="section() !== 'practice'" [attr.aria-hidden]="section() !== 'practice' ? 'true' : null"
        [attr.inert]="section() !== 'practice' ? '' : null" (openTab)="chooseFile()" />
      @if (section() === 'settings') { <gp-settings-panel /> }
      @else if (section() !== 'practice') {
        <section class="section-page" [attr.aria-label]="('nav.' + section()) | transloco">
          <span class="section-symbol"><gp-icon [name]="sectionIcon()" /></span><p class="eyebrow">{{ 'shell.comingLater' | transloco }}</p>
          <h2>{{ ('nav.' + section()) | transloco }}</h2>
          <p class="section-description">{{ ('shell.' + section() + 'Unavailable') | transloco }}</p>
          <button class="secondary-button" type="button" [title]="'shell.backToPractice' | transloco" (click)="section.set('practice')">{{ 'shell.backToPractice' | transloco }}</button>
        </section>
      }
    </main>
    <gp-tracks-panel [collapsed]="tracksCollapsed()" [tracks]="tracks()" [mixer]="session.mixer()"
      (toggle)="tracksCollapsed.set(!tracksCollapsed())" (mute)="session.toggleMute($event)" (solo)="session.toggleSolo($event)"
      (volumeChange)="session.setTrackVolume($event.index, $event.volume)" />
  </div>
  <gp-transport-bar />
</div>
