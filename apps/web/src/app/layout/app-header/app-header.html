<header class="app-header">
  <button type="button" class="brand brand-button" [title]="'nav.practice' | transloco" (click)="goHome()">
    <span class="brand-mark"><gp-icon name="guitar" /></span>
    <div class="brand-copy">
      <div class="brand-title"><h1>{{ 'app.name' | transloco }}</h1><span class="version">v{{ version }}</span></div>
      <p>{{ 'shell.tagline' | transloco }}</p>
    </div>
  </button>

  <div class="header-center" aria-hidden="true"></div>

  <div class="header-actions">
    <div class="language-picker" role="group" [attr.aria-label]="'language.label' | transloco">
      <button type="button" lang="en" [title]="'language.english' | transloco" [attr.aria-pressed]="language.current() === 'en'" (click)="language.select('en')">EN</button>
      <button type="button" lang="it" [title]="'language.italian' | transloco" [attr.aria-pressed]="language.current() === 'it'" (click)="language.select('it')">IT</button>
    </div>
    <button type="button" class="icon-button settings-toggle"
      [class.active]="active() === 'settings'"
      [attr.aria-label]="'nav.settings' | transloco"
      [title]="'nav.settings' | transloco"
      [attr.aria-pressed]="active() === 'settings'"
      (click)="toggleSettings()">
      <gp-icon name="settings" />
    </button>
  </div>
</header>
